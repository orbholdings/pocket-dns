[platformio]
default_envs = esp32-4mb

[env]
platform = espressif32@6.12.0
framework = arduino
lib_deps = bblanchon/ArduinoJson@6.21.5
board_build.filesystem = littlefs
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/pio_metadata.py
build_flags = -std=gnu++11

[env:esp32-4mb]
board = esp32dev
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions/esp32-4mb.csv

[env:esp32s3-4mb]
board = esp32-s3-devkitc-1
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions/esp32-4mb.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-8mb]
board = esp32-s3-devkitc-1
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = partitions/esp32s3-8mb.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-16mb]
board = esp32-s3-devkitc-1
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions/esp32s3-16mb.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

